<script>
(function () {
  const style = document.createElement("style");
  style.innerHTML = `
    #lovable-badge,
    [id*="lovable"],
    [class*="lovable"],
    a[href*="lovable"]{
      display:none !important;
      visibility:hidden !important;
      opacity:0 !important;
      pointer-events:none !important;
    }
  `;
  document.head.prepend(style);

  const remove = () => {
    document.querySelectorAll(
      '#lovable-badge,[id*="lovable"],[class*="lovable"],a[href*="lovable"]'
    ).forEach(el => el.remove());
  };

  remove();

  new MutationObserver(remove).observe(document.documentElement, {
    childList: true,
    subtree: true
  });
})();
</script>

    <script>
      // Aplica o tema antes do React montar para evitar flash de tela clara
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") t = "dark";
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();

      window.__eliteBoot = (async function () {
        var isVitePreview = location.hostname.includes("lovableproject.com") || location.hostname.includes("lovable.app") || location.hostname === "localhost";

        if ("serviceWorker" in navigator && isVitePreview) {
          try {
            var registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
            if (window.caches) {
              var keys = await caches.keys();
              await Promise.all(keys.filter(function (key) { return key.indexOf("elite-lab-") === 0; }).map(function (key) { return caches.delete(key); }));
            }
          } catch (err) {
            console.warn("SW cleanup failed:", err);
          }
          return;
        }

        // Registra o Service Worker para PWA somente fora do preview/dev
        if ("serviceWorker" in navigator) {
          window.addEventListener("load", function () {
            navigator.serviceWorker.register("/sw.js").catch(function (err) {
              console.warn("SW registration failed:", err);
            });
          });
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module">
      (function () {
        var RELOAD_KEY = "elite:boot-reload";
        function boot(attempt) {
          return import("/src/main.tsx?boot=" + Date.now()).catch(function (err) {
            if (attempt < 1) {
              return new Promise(function (r) { setTimeout(r, 500); }).then(function () {
                return boot(attempt + 1);
              });
            }
            var reloaded = false;
            try { reloaded = sessionStorage.getItem(RELOAD_KEY) === "1"; } catch (e) {}
            if (!reloaded) {
              try { sessionStorage.setItem(RELOAD_KEY, "1"); } catch (e) {}
              window.location.reload();
              return;
            }
            throw err;
          });
        }
        Promise.resolve(window.__eliteBoot)
          .then(function () { return boot(0); })
          .then(function () {
            try { sessionStorage.removeItem(RELOAD_KEY); } catch (e) {}
          });
      })();
    </script>
