  <body>
    <script>
      // Aplica o tema antes do React montar para evitar flash de tela clara
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") t = "dark";
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();

      window.__eliteBoot = (async function () {
        var isVitePreview = location.hostname.includes("lovableproject.com") || location.hostname.includes("lovable.app") || location.hostname === "localhost";

        if ("serviceWorker" in navigator && isVitePreview) {
          try {
            var registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
            if (window.caches) {
              var keys = await caches.keys();
              await Promise.all(keys.filter(function (key) { return key.indexOf("elite-lab-") === 0; }).map(function (key) { return caches.delete(key); }));
            }
          } catch (err) {
            console.warn("SW cleanup failed:", err);
          }
          return;
        }

        // Registra o Service Worker para PWA somente fora do preview/dev
        if ("serviceWorker" in navigator) {
          window.addEventListener("load", function () {
            navigator.serviceWorker.register("/sw.js").catch(function (err) {
              console.warn("SW registration failed:", err);
            });
          });
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module">
      await window.__eliteBoot;
      await import("/src/main.tsx");
    </script>
  </body>
